<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerDNS Health — Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 24px;
        }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 600; }

        .nav {
            display: flex; gap: 4px; margin-bottom: 24px;
            border-bottom: 1px solid #383838; padding-bottom: 8px;
        }
.nav a {
            color: #9E9E9E; text-decoration: none; padding: 8px 16px;
            border-radius: 8px; font-size: 14px; transition: all 0.12s;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .nav a:hover { color: #E0E0E0; background: #2A2A2A; }
        .nav a.active { color: #E0E0E0; background: #2A2A2A; font-weight: 600; }

        .section { margin-bottom: 24px; }
        .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #E0E0E0; }

        .card {
            background: #1E1E1E; border: 1px solid #383838; border-radius: 16px;
            padding: 20px 24px; max-width: 640px;
        }

        .form-group { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
        .form-group label { font-size: 13px; color: #9E9E9E; min-width: 120px; flex-shrink: 0; line-height: 1; }
        .form-group input, .form-group select {
            flex: 1; padding: 10px 14px; background: #121212; border: 1px solid #383838;
            border-radius: 10px; color: #E0E0E0; font-size: 13px; outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: #9E9E9E; }
        .form-group .hint { font-size: 11px; color: #6B6B6B; margin-left: auto; }

        .toggle {
            position: relative; display: inline-flex; align-items: center; width: 44px; height: 24px; flex-shrink: 0;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle .slider {
            position: absolute; cursor: pointer; inset: 0;
            background: #383838; border-radius: 999px; transition: 0.2s;
        }
        .toggle .slider::before {
            content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px;
            background: #E0E0E0; border-radius: 50%; transition: 0.2s;
        }
        .toggle input:checked + .slider { background: #4ADE80; }
        .toggle input:checked + .slider::before { transform: translateX(20px); }

        .btn {
            padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.12s;
        }
        .btn-primary { background: #9E9E9E; color: #121212; }
        .btn-primary:hover { background: #B0B0B0; }
        .btn-ghost { background: transparent; color: #9E9E9E; border: 1px solid #383838; margin-right: 8px; }
        .btn-ghost:hover { background: #2A2A2A; color: #E0E0E0; }

        .save-bar {
            display: flex; align-items: center; gap: 12px; margin-top: 20px; padding-top: 16px;
            border-top: 1px solid #383838;
        }
        .save-bar .saved-msg { font-size: 12px; color: #4ADE80; opacity: 0; transition: opacity 0.3s; }
        .save-bar .saved-msg.show { opacity: 1; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚙ Settings</h1>
</div>

<div class="nav">
    <a href="#">📊 Dashboard</a>
    <a href="#">📋 Records</a>
    <a href="#">🖥 IP Health</a>
    <a href="#" class="active">⚙ Settings</a>
</div>

<div class="section">
    <div class="section-title">DNS Server</div>
    <div class="card">
        <div class="form-group">
            <label>Bind Address</label>
            <input value="0.0.0.0:8053">
        </div>
        <div class="form-group">
            <label>Package Size</label>
            <input value="1500" style="max-width:120px;">
            <span class="hint">bytes</span>
        </div>
    </div>
</div>

<div class="section">
    <div class="section-title">Web Server</div>
    <div class="card">
        <div class="form-group">
            <label>Enabled</label>
            <div class="toggle"><input type="checkbox" checked><span class="slider"></span></div>
        </div>
        <div class="form-group">
            <label>Host</label>
            <input value="0.0.0.0">
        </div>
        <div class="form-group">
            <label>Port</label>
            <input value="8080" style="max-width:120px;">
        </div>
    </div>
</div>

<div class="section">
    <div class="section-title">Default Record Settings</div>
    <div class="card">
        <div class="form-group">
            <label>Default TTL</label>
            <input value="PT30S" style="max-width:160px;">
            <span class="hint">ISO 8601 duration</span>
        </div>
        <div class="form-group">
            <label>Default Policy</label>
            <select style="max-width:200px;">
                <option>ALL_HEALTHY</option>
                <option>ROUND_ROBIN_HEALTHY</option>
                <option>FIRST_HEALTHY</option>
            </select>
        </div>
    </div>
</div>

<div class="section">
    <div class="section-title">Config</div>
    <div class="card">
        <div class="form-group">
            <label>Config Path</label>
            <input value="config.yaml" disabled style="opacity:0.6;">
        </div>
        <div class="form-group" style="flex-direction:column; align-items:stretch;">
            <label style="margin-bottom:4px;">Raw YAML</label>
            <textarea style="width:100%; min-height:200px; background:#121212; border:1px solid #383838; border-radius:10px; padding:12px; color:#E0E0E0; font-family:monospace; font-size:12px; outline:none; resize:vertical;" readonly>server:
  bind: 0.0.0.0:8053
web:
  enabled: true
  host: 0.0.0.0
  port: 8080
domains:
  ips:
    - ip: 192.168.76.110
      healthCheck:
        http:
          url: http://192.168.76.110:8384/...
  records:
    - domain: gpd.xx
      ttl: PT30S
      ips:
        - 192.168.76.133</textarea>
            <span class="hint" style="margin-top:4px;">Файл конфига, перезагружается при сохранении</span>
        </div>
    </div>
</div>

<div class="save-bar">
    <button class="btn btn-ghost" onclick="showSaved()">Reset</button>
    <button class="btn btn-primary" onclick="showSaved()">Save Changes</button>
    <span class="saved-msg" id="savedMsg">✓ Saved</span>
</div>

<script>
    function showSaved() {
        const el = document.getElementById('savedMsg');
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    }
</script>

</body>
</html>
