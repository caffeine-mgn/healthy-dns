<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerDNS Health — Dialog: Record</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 40px;
        }
        h1 { font-size: 18px; margin-bottom: 24px; }
        .info { color: #6B6B6B; font-size: 13px; margin-bottom: 24px; }

        /* === МОДАЛКА === */
        .modal-overlay {
            display: flex; align-items: center; justify-content: center;
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 100;
        }
        .modal {
            background: #1E1E1E; border: 1px solid #383838; border-radius: 20px;
            padding: 28px 32px; max-width: 620px; width: 95%;
            max-height: 90vh; overflow-y: auto;
        }

        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-track { background: transparent; }
        .modal::-webkit-scrollbar-thumb { background: #383838; border-radius: 999px; }

        .modal-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
        }
        .modal-header h2 { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: none; background: transparent; color: #6B6B6B;
            font-size: 18px; cursor: pointer; transition: all 0.12s;
        }
        .modal-close:hover { background: #2A2A2A; color: #E0E0E0; }

        .form-section {
            margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #2A2A2A;
        }
        .form-section:last-of-type { border-bottom: none; margin-bottom: 0; }
        .form-section-title {
            font-size: 12px; color: #6B6B6B; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .form-row {
            display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start;
        }
        .form-row:last-child { margin-bottom: 0; }
        .form-group {
            flex: 1; display: flex; flex-direction: column; gap: 4px;
        }
        .form-group label {
            font-size: 11px; color: #9E9E9E; font-weight: 500;
        }
        .form-group input, .form-group select {
            padding: 10px 14px; background: #121212; border: 1px solid #383838;
            border-radius: 10px; color: #E0E0E0; font-size: 13px; outline: none;
            font-family: inherit; transition: border-color 0.12s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #9E9E9E; }
        .form-group input::placeholder { color: #6B6B6B; }
        .form-group select { cursor: pointer; }

        .form-group .hint { font-size: 10px; color: #6B6B6B; }

        /* Список IP/инпутов */
        .array-input {
            display: flex; flex-direction: column; gap: 6px;
        }
        .array-input .item {
            display: flex; gap: 6px; align-items: center;
        }
        .array-input .item input { flex: 1; }
        .array-input .item .remove {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: none; background: transparent; color: #E04848;
            font-size: 16px; cursor: pointer; transition: all 0.12s; flex-shrink: 0;
        }
        .array-input .item .remove:hover { background: #3a1a1a; }
        .array-input .add {
            align-self: flex-start; padding: 6px 14px; border-radius: 8px;
            border: 1px dashed #383838; background: transparent; color: #9E9E9E;
            font-size: 12px; cursor: pointer; transition: all 0.12s;
        }
        .array-input .add:hover { border-color: #9E9E9E; color: #E0E0E0; }

        /* Downstream секция */
        .downstream-toggle {
            display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
        }
        .toggle {
            position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle .slider {
            position: absolute; cursor: pointer; inset: 0;
            background: #383838; border-radius: 999px; transition: 0.2s;
        }
        .toggle .slider::before {
            content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px;
            background: #E0E0E0; border-radius: 50%; transition: 0.2s;
        }
        .toggle input:checked + .slider { background: #4ADE80; }
        .toggle input:checked + .slider::before { transform: translateX(16px); }
        .downstream-toggle label { font-size: 12px; color: #9E9E9E; cursor: pointer; }

        .downstream-body { display: none; }
        .downstream-body.open { display: block; }

        .modal-footer {
            display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; padding-top: 16px;
            border-top: 1px solid #2A2A2A;
        }
        .btn {
            padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.12s;
        }
        .btn-primary { background: #9E9E9E; color: #121212; }
        .btn-primary:hover { background: #B0B0B0; }
        .btn-cancel { background: transparent; color: #9E9E9E; border: 1px solid #383838; }
        .btn-cancel:hover { background: #2A2A2A; color: #E0E0E0; }
        .btn-danger { background: #3a1a1a; color: #E04848; border: 1px solid #E04848; }
        .btn-danger:hover { background: #4a2a2a; }
    </style>
</head>
<body>

<h1>📋 Dialog: DNS Record</h1>
<p class="info">Макет модального окна добавления/редактирования DNS-записи.</p>

<div class="modal-overlay">
    <div class="modal">

        <!-- HEADER -->
        <div class="modal-header">
            <h2>✎ Edit Record</h2>
            <button class="modal-close">✕</button>
        </div>

        <!-- DOMAIN -->
        <div class="form-section">
            <div class="form-section-title">Domain</div>
            <div class="form-group">
                <input value="myapp.xx" placeholder="e.g. myapp.xx">
                <span class="hint">Wildcard: *.example.xx</span>
            </div>
        </div>

        <!-- IPS -->
        <div class="form-section">
            <div class="form-section-title">IP Addresses</div>
            <div class="array-input">
                <div class="item">
                    <input value="192.168.76.110" placeholder="IP address">
                    <button class="remove">✕</button>
                </div>
                <div class="item">
                    <input value="192.168.76.111" placeholder="IP address">
                    <button class="remove">✕</button>
                </div>
                <button class="add">+ Add IP</button>
            </div>
        </div>

        <!-- POLICY & TTL -->
        <div class="form-section">
            <div class="form-section-title">Resolution</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Policy</label>
                    <select>
                        <option selected>ALL_HEALTHY</option>
                        <option>FIRST_HEALTHY</option>
                        <option>ROUND_ROBIN_HEALTHY</option>
                    </select>
                    <span class="hint">ALL_HEALTHY — возвращает все здоровые IP</span>
                </div>
                <div class="form-group" style="max-width:140px;">
                    <label>TTL</label>
                    <input value="PT30S" placeholder="PT30S">
                    <span class="hint">ISO 8601 duration</span>
                </div>
            </div>
        </div>

        <!-- DOWNSTREAM -->
        <div class="form-section">
            <div class="form-section-title">Downstream</div>
            <div class="downstream-toggle">
                <div class="toggle"><input type="checkbox" checked id="dsToggle"><span class="slider"></span></div>
                <label for="dsToggle">Forward unresolved queries</label>
            </div>
            <div class="downstream-body open">
                <div class="array-input">
                    <div class="item">
                        <input value="10.0.0.1:53" placeholder="host:port">
                        <button class="remove">✕</button>
                    </div>
                    <div class="item">
                        <input value="10.0.0.2:53" placeholder="host:port">
                        <button class="remove">✕</button>
                    </div>
                    <button class="add">+ Add Downstream</button>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="modal-footer">
            <button class="btn btn-cancel">Cancel</button>
            <button class="btn btn-danger">Delete</button>
            <button class="btn btn-primary">Save</button>
        </div>

    </div>
</div>

</body>
</html>
</COMPRESSED>
